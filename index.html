<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where Do I Meet My Homies</title>
  <meta name="description" content="Find the fairest place to meet 1–10 friends with isochrone maps, then get ideas for what to do there." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <header id="hud">
    <div id="status">
      <ol id="steps"></ol>
      <span id="step-label"></span>
      <span id="clock" hidden></span>
    </div>
    <div id="toast" hidden></div>
  </header>

  <aside id="panel">
    <div class="brand">
      <h1>Where do I meet my homies?</h1>
      <p class="tag">Find the fairest place to meet, by real travel time.</p>
    </div>
    <section id="setup"></section>
    <section id="results" hidden></section>
  </aside>

  <aside id="plans" hidden></aside>

  <nav id="options" hidden aria-label="Similar meeting options"></nav>

  <footer id="player" hidden>
    <button class="pl-btn" data-act="toggle" title="Pause / play"></button>
    <div class="pl-label"></div>
    <input class="pl-scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline" />
    <button class="pl-btn txt" data-act="speed" title="Speed">1×</button>
    <button class="pl-btn" data-act="skip" title="Skip to the end"></button>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
